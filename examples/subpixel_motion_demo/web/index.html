<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Subpixel Motion Demo for WebParagraph">

  <title>Subpixel Motion Demo (WebParagraph vs CanvasKit)</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin: 0; background-color: #121212;">
  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    const searchParams = new URLSearchParams(window.location.search);
    let preferWebParagraph = true; // Default

    if (searchParams.has('ck')) {
      preferWebParagraph = false;
    } else if (searchParams.has('wp')) {
      preferWebParagraph = true;
    }

    _flutter.loader.load({
      config: {
        preferWebParagraph: preferWebParagraph,
        renderer: "canvaskit"
      },
    });
  </script>
</body>
</html>
